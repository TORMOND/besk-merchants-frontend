[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  query = {path = ":https://beskmerchants.netlify.app/"}
  force = true

[[redirects]]
  from = "/ProductPage/*"
  to = "/ProductPage/:splat"
  status = 200
  query = {path = ":https://beskmerchants.netlify.app/ProductPage/*"}
  force = true 

[[redirects]]
  from = "/cart/*"
  to = "/cart?success={CHECKOUT_SESSION_ID}"
  status = 200
  query = {path = ":https://beskmerchants.netlify.app/cart?success={CHECKOUT_SESSION_ID}"}
